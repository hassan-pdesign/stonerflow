<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoner Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #d7ebe3;
    --sage: #6f9f86;
    --deep-sage: #2f5a48;
    --dawn: #f2c14e;
    --clay: #c46b4a;
    --sky: #9ec9c2;
    --ink: #1e332c;
    --cream: #f7faf7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; }

  body {
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink);
    background:
      radial-gradient(ellipse 90% 70% at 15% 85%, rgba(196, 107, 74, 0.28), transparent 55%),
      radial-gradient(ellipse 80% 60% at 88% 12%, rgba(242, 193, 78, 0.35), transparent 50%),
      linear-gradient(165deg, #b8ddd2 0%, #e8f3ee 38%, #f6ead7 72%, #d4e8df 100%);
  }

  /* full-bleed atmospheric plane */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 40%),
      repeating-linear-gradient(
        -12deg,
        transparent 0,
        transparent 18px,
        rgba(47, 90, 72, 0.03) 18px,
        rgba(47, 90, 72, 0.03) 19px
      );
  }

  .horizon {
    position: fixed;
    left: -10%;
    right: -10%;
    bottom: -8%;
    height: 42vh;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 100%, rgba(47, 90, 72, 0.45), transparent 70%),
      linear-gradient(180deg, transparent 0%, rgba(47, 90, 72, 0.22) 55%, rgba(30, 51, 44, 0.35) 100%);
    clip-path: polygon(0 38%, 12% 28%, 24% 42%, 38% 22%, 52% 36%, 68% 18%, 82% 34%, 100% 24%, 100% 100%, 0 100%);
    animation: breathe-land 14s ease-in-out infinite;
  }

  @keyframes breathe-land {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-1.2vh) scaleX(1.01); }
  }

  #flow-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 3;
    padding: 1.25rem 1.5rem;
    max-width: 18em;
  }

  .brand {
    font-family: 'Grandstander', cursive;
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 7.5rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--deep-sage);
    text-wrap: balance;
    animation: brand-drift 9s ease-in-out infinite;
  }

  .brand span {
    display: block;
    color: var(--clay);
  }

  @keyframes brand-drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-0.35rem); }
  }

  .tag {
    margin-top: clamp(1.1rem, 3.5vw, 1.85rem);
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: clamp(0.95rem, 2.6vw, 1.2rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.78;
  }

  .tag em {
    font-style: normal;
    color: var(--sage);
  }

  .ripple {
    position: absolute;
    left: 50%;
    bottom: -1.6rem;
    width: min(70vw, 16rem);
    height: 2px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--sage), var(--dawn), var(--clay), transparent);
    opacity: 0.55;
    animation: ripple-pulse 4.5s ease-in-out infinite;
  }

  @keyframes ripple-pulse {
    0%, 100% { transform: translateX(-50%) scaleX(0.72); opacity: 0.35; }
    50% { transform: translateX(-50%) scaleX(1); opacity: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    .horizon, .brand, .ripple { animation: none; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <canvas id="flow-canvas" aria-hidden="true"></canvas>

  <div class="content">
    <h1 class="brand">Stoner <span>Flow</span></h1>
    <p class="tag">lighting up <em>soon</em></p>
    <div class="ripple" aria-hidden="true"></div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('flow-canvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w = 0, h = 0, t = 0;
  const ribbons = [];

  const palette = [
    { stroke: 'rgba(111, 159, 134, 0.35)', width: 2.2 },
    { stroke: 'rgba(196, 107, 74, 0.28)', width: 1.6 },
    { stroke: 'rgba(242, 193, 78, 0.3)', width: 1.8 },
    { stroke: 'rgba(47, 90, 72, 0.22)', width: 2.6 },
    { stroke: 'rgba(158, 201, 194, 0.4)', width: 1.4 }
  ];

  function resize() {
    w = canvas.width = window.innerWidth * devicePixelRatio;
    h = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  function makeRibbons() {
    ribbons.length = 0;
    const count = Math.min(9, Math.max(5, Math.floor(window.innerWidth / 160)));
    for (let i = 0; i < count; i++) {
      const p = palette[i % palette.length];
      ribbons.push({
        y: (i + 1) / (count + 1),
        amp: 18 + (i % 3) * 14,
        freq: 0.0012 + (i % 4) * 0.00035,
        speed: 0.35 + (i % 5) * 0.12,
        phase: i * 1.7,
        stroke: p.stroke,
        width: p.width
      });
    }
  }

  function draw() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    ctx.clearRect(0, 0, vw, vh);

    for (const r of ribbons) {
      ctx.beginPath();
      ctx.lineWidth = r.width;
      ctx.strokeStyle = r.stroke;
      ctx.lineCap = 'round';

      const baseY = vh * (0.18 + r.y * 0.55);
      for (let x = -40; x <= vw + 40; x += 8) {
        const y = baseY
          + Math.sin(x * r.freq + t * r.speed + r.phase) * r.amp
          + Math.sin(x * r.freq * 0.45 - t * r.speed * 0.7 + r.phase) * (r.amp * 0.45);
        if (x === -40) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // soft vapor blobs drifting along the flow
    for (let i = 0; i < 6; i++) {
      const x = ((t * (12 + i * 7) + i * 170) % (vw + 120)) - 60;
      const y = vh * (0.25 + (i % 3) * 0.18)
        + Math.sin(t * 0.4 + i) * 24;
      const radius = 28 + (i % 3) * 16;
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
      g.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion) {
      t += 0.016;
      requestAnimationFrame(draw);
    }
  }

  resize();
  makeRibbons();
  draw();

  window.addEventListener('resize', () => {
    resize();
    makeRibbons();
    if (reduceMotion) draw();
  });
})();
</script>
</body>
</html>

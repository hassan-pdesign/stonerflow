<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoner Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
    background: linear-gradient(
      135deg,
      #e8a33d, #d96c3b, #b5573e, #6b8e3d, #3f8e7c, #c95d8a, #e8a33d
    );
    background-size: 400% 400%;
    animation: drift 28s ease infinite;
  }

  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* soft glowing earth-light blobs */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.45;
    pointer-events: none;
  }
  body::before {
    width: 45vmax; height: 45vmax;
    top: -12vmax; left: -10vmax;
    background: radial-gradient(circle, #f4d35e 0%, transparent 70%);
    animation: bob 16s ease-in-out infinite;
  }
  body::after {
    width: 40vmax; height: 40vmax;
    bottom: -14vmax; right: -10vmax;
    background: radial-gradient(circle, #8fbf6b 0%, transparent 70%);
    animation: bob 22s ease-in-out infinite reverse;
  }
  @keyframes bob {
    0%,100% { transform: translate(0,0); }
    50%     { transform: translate(4vmax, 5vmax); }
  }

  /* falling foliage */
  #fall-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }

  .drop {
    position: absolute;
    top: -12vh;
    will-change: transform;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .drop .spin {
    display: block;
    width: 100%; height: 100%;
    animation-name: sway-spin;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  @keyframes fall {
    from { transform: translateY(0); }
    to   { transform: translateY(118vh); }
  }
  @keyframes sway-spin {
    from { transform: translateX(-22px) rotate(-50deg); }
    to   { transform: translateX(22px)  rotate(60deg); }
  }

  .content { position: relative; z-index: 2; padding: 1rem; }

  .title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(3.2rem, 13vw, 10rem);
    line-height: 1;
    color: #fff8ec;
    text-shadow:
      0 0 1px #5a3a1a,
      3px 4px 0 rgba(90, 58, 26, 0.35),
      0 6px 26px rgba(0, 0, 0, 0.25);
    animation: title-sway 7s ease-in-out infinite;
  }
  @keyframes title-sway {
    0%,100% { transform: rotate(-2deg) translateY(0); }
    50%     { transform: rotate(2deg) translateY(-6px); }
  }

  .subtitle {
    position: relative;
    display: inline-block;
    margin-top: clamp(1.4rem, 4vw, 2.4rem);
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(1.2rem, 3.9vw, 1.95rem);
    letter-spacing: 0.35em;
    text-transform: lowercase;
    padding: 0 0.4em 0.15em;
  }

  /* the text itself, made of fire */
  .fire-text {
    position: relative;
    z-index: 2;
    background: linear-gradient(0deg,
      #ff3d00 0%, #ff7a00 32%, #ffc400 64%, #fff3b0 100%);
    background-size: 100% 220%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #ff8a00;
    animation: flicker 2.4s ease-in-out infinite,
               ember 2.8s ease-in-out infinite alternate;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; background-position: 50% 0%;
      filter: drop-shadow(0 0 6px rgba(255,120,0,0.55)) drop-shadow(0 -2px 12px rgba(255,60,0,0.45)); }
    25% { opacity: 0.9; background-position: 50% 35%; }
    50% { opacity: 1; background-position: 50% 70%;
      filter: drop-shadow(0 0 11px rgba(255,160,0,0.8)) drop-shadow(0 -3px 18px rgba(255,40,0,0.6)); }
    72% { opacity: 0.94; background-position: 50% 28%; }
  }
  @keyframes ember {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-2px) scale(1.012); }
  }
</style>
</head>
<body>
  <div id="fall-layer"></div>

  <div class="content">
    <h1 class="title">Stoner Flow</h1>
    <p class="subtitle">
      <span class="fire-text">lighting&nbsp;up&nbsp;soon</span>
    </p>
  </div>

<script>
(function () {
  const layer = document.getElementById('fall-layer');

  // shape generators (SVG strings), fill set via currentColor
  const shapes = {
    leaf: c => `<svg viewBox="0 0 100 100" style="color:${c}"><path fill="currentColor" d="M50 5 C20 25 15 65 50 95 C85 65 80 25 50 5 Z"/><path stroke="rgba(0,0,0,0.18)" stroke-width="3" fill="none" d="M50 12 L50 90"/></svg>`,
    petal: c => `<svg viewBox="0 0 100 100" style="color:${c}"><ellipse cx="50" cy="50" rx="24" ry="46" fill="currentColor"/></svg>`,
    flower: (c, center) => `<svg viewBox="0 0 100 100" style="color:${c}"><g fill="currentColor"><circle cx="50" cy="22" r="13"/><circle cx="50" cy="78" r="13"/><circle cx="22" cy="50" r="13"/><circle cx="78" cy="50" r="13"/><circle cx="30" cy="30" r="13"/><circle cx="70" cy="30" r="13"/><circle cx="30" cy="70" r="13"/><circle cx="70" cy="70" r="13"/></g><circle cx="50" cy="50" r="12" fill="${center}"/></svg>`
  };

  const greens = ['#7fae4f', '#5d8c39', '#a8d08a', '#3f8e7c'];
  const petals = ['#f3a6c0', '#f7e07a', '#fff3df', '#e8a33d', '#d96c3b'];
  const centers = ['#c9603a', '#f7e07a', '#e8a33d'];

  const rand = (min, max) => Math.random() * (max - min) + min;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const TOTAL = 34;

  for (let i = 0; i < TOTAL; i++) {
    const drop = document.createElement('div');
    drop.className = 'drop';

    // depth: 0 (far) -> 1 (near)
    const depth = Math.random();
    const size = rand(12, 40) * (0.5 + depth);      // near = bigger
    const opacity = 0.35 + depth * 0.55;            // near = more opaque
    const blur = (1 - depth) * 2.2;                 // far = softer
    const fallDur = rand(22, 12) - depth * 4;       // near = a touch faster
    const swayDur = rand(3.5, 7);

    drop.style.left = rand(-2, 100) + 'vw';
    drop.style.width = size + 'px';
    drop.style.height = size + 'px';
    drop.style.opacity = opacity.toFixed(2);
    drop.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : 'none';
    drop.style.zIndex = Math.round(depth * 5);
    drop.style.animationDuration = fallDur.toFixed(1) + 's';
    drop.style.animationDelay = (-rand(0, fallDur)).toFixed(1) + 's';

    const inner = document.createElement('span');
    inner.className = 'spin';
    inner.style.animationDuration = swayDur.toFixed(1) + 's';
    inner.style.animationDelay = (-rand(0, swayDur)).toFixed(1) + 's';

    const roll = Math.random();
    if (roll < 0.45) {
      inner.innerHTML = shapes.leaf(pick(greens));
    } else if (roll < 0.78) {
      inner.innerHTML = shapes.petal(pick(petals));
    } else {
      inner.innerHTML = shapes.flower(pick(petals), pick(centers));
    }

    drop.appendChild(inner);
    layer.appendChild(drop);
  }
})();
</script>
</body>
</html>
